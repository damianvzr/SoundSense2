<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body style="margin:0;background:transparent">
<script>
var umbral = 60;
var escuchando = false;
var ctx, analizador, mic, datos;
var ultimaAlerta = 0;
var COOLDOWN = 2000;

function fijarUmbral(v){
  umbral = Number(v);
}

function iniciar(){
  if(escuchando) return;
  navigator.mediaDevices.getUserMedia({audio:true, video:false})
  .then(function(stream){
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    analizador = ctx.createAnalyser();
    analizador.fftSize = 512;
    mic = ctx.createMediaStreamSource(stream);
    mic.connect(analizador);
    datos = new Float32Array(analizador.fftSize);
    escuchando = true;
    medir();
    enviar('listo', 0, 'ninguno');
  })
  .catch(function(){
    enviar('error', 0, 'ninguno');
  });
}

function detener(){
  escuchando = false;
  if(ctx){ ctx.close(); ctx = null; }
  enviar('detenido', 0, 'ninguno');
}

function medir(){
  if(!escuchando) return;
  analizador.getFloatTimeDomainData(datos);
  var rms = 0;
  for(var i = 0; i < datos.length; i++) rms += datos[i] * datos[i];
  rms = Math.sqrt(rms / datos.length);
  var db = rms > 0.00001 ? 20 * Math.log10(rms) : -100;
  var nivel = Math.max(0, Math.min(100, db + 100));
  var clasificacion = clasificar(nivel);
  var ahora = Date.now();
  if(nivel >= umbral && ahora - ultimaAlerta > COOLDOWN){
    ultimaAlerta = ahora;
    vibrar(clasificacion);
    enviar('alerta', Math.round(nivel), clasificacion);
  }
  requestAnimationFrame(medir);
}

function clasificar(nivel){
  if(nivel >= 80) return 'alto';
  if(nivel >= 55) return 'medio';
  return 'bajo';
}

function vibrar(clasificacion){
  if(!navigator.vibrate) return;
  if(clasificacion === 'alto'){
    navigator.vibrate([400, 100, 400, 100, 400]);
  } else if(clasificacion === 'medio'){
    navigator.vibrate([300, 100, 300]);
  } else {
    navigator.vibrate(250);
  }
}

function enviar(tipo, nivel, clasificacion){
  var msg = JSON.stringify({
    tipo: tipo,
    nivel: nivel,
    clasificacion: clasificacion
  });
  try{ window.ReactNativeWebView.postMessage(msg); }catch(e){}
}
</script>
</body>
</html>
